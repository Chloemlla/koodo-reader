name: Build Koodo Reader

on:
  push:
    branches:
      - "**"
    paths:
      - "src/**"
      - "main.js"
      - "preload.js"
      - "package.json"
      - "yarn.lock"
      - "public/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "src/**"
      - "main.js"
      - "preload.js"
      - "package.json"
      - "yarn.lock"
      - "public/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build desktop app
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-26, ubuntu-22.04, windows-2022, ubuntu-24.04-arm]
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      USE_HARD_LINKS: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Snapcraft
        if: startsWith(matrix.os, 'ubuntu-22.04')
        uses: samuelmeuli/action-snapcraft@v3

      - name: Install Gcc
        if: startsWith(matrix.os, 'ubuntu-22.04')
        run: |
          sudo apt update
          sudo apt-get install gcc-multilib g++-multilib

      - name: Install FPM
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: |
          sudo apt update
          sudo apt-get install -y ruby-full build-essential zlib1g-dev liblzma-dev
          sudo gem install --no-document fpm

      - name: Set environment variable USE_SYSTEM_FPM
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        shell: bash
        run: echo "USE_SYSTEM_FPM=true" >> $GITHUB_ENV

      - name: Prepare for app notarization (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          mkdir -p ~/private_keys/
          echo '${{ secrets.API_KEY }}' > ~/private_keys/AuthKey_${{ secrets.API_KEY_ID }}.p8
          brew install python-setuptools

      - name: Modify package.json for dev branch
        if: github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -Command "(Get-Content package.json) -replace '\"productName\": \"Koodo Reader\"', '\"productName\": \"Koodo Reader DEV\"' | Set-Content package.json"
          else
            sed -i.bak 's/"productName": "Koodo Reader"/"productName": "Koodo Reader DEV"/' package.json
          fi

      - name: Read app version
        shell: bash
        run: |
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          SHORT_HASH="${GITHUB_SHA::8}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%MZ)"
          echo "KOODO_READER_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "KOODO_READER_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "KOODO_SHORT_HASH=${SHORT_HASH}" >> "$GITHUB_ENV"
          echo "KOODO_BUILD_TIME=${BUILD_TIME}" >> "$GITHUB_ENV"
          echo "KOODO_READER_RELEASE_VERSION=${VERSION_NAME}-${SHORT_HASH}" >> "$GITHUB_ENV"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version='${VERSION_NAME}-${SHORT_HASH}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Modify package.json for Linux arm64 build
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: |
          jq '.build.linux.target = [
            {
              "target": "deb",
              "arch": ["arm64"]
            },
            {
              "target": "AppImage",
              "arch": ["arm64"]
            }
          ]' package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Run unit tests
        shell: bash
        run: |
          if find src -type f \( -name '*.test.*' -o -name '*.spec.*' \) | grep -q .; then
            yarn test --watchAll=false
          else
            echo "No test files found; skipping tests."
          fi

      - name: Prepare signing key (if available)
        id: sign-prep
        shell: bash
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
        run: |
          if [ -n "$MAC_CERTS" ]; then
            echo "signing_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::MAC_CERTS secret not set. Building unsigned app."
            echo "signing_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build/release Electron app
        uses: samuelmeuli/action-electron-builder@v1.6.0
        with:
          build_script_name: "build"
          github_token: ${{ secrets.github_token }}
          mac_certs: ${{ secrets.MAC_CERTS }}
          mac_certs_password: ${{ secrets.MAC_CERTS_PASSWORD }}
          release: false
        env:
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.API_KEY_ISSUER_ID }}

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koodo-reader-verification-reports-${{ matrix.os }}
          path: build/
          retention-days: 14

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koodo-reader-release-assets-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Automatic release (main branch only)
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    steps:
      - name: Read app version
        shell: bash
        run: |
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          SHORT_HASH="${GITHUB_SHA::8}"
          echo "KOODO_READER_RELEASE_VERSION=${VERSION_NAME}-${SHORT_HASH}" >> "$GITHUB_ENV"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Automatic release (main branch only)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          make_latest: true
          generate_release_notes: true
          tag_name: "v${{ env.KOODO_READER_RELEASE_VERSION }}"
          prerelease: false
          name: "Koodo Reader ${{ env.KOODO_READER_RELEASE_VERSION }}"
          files: release-assets/*
